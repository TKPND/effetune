<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>EffeTune</title>
  <link rel="stylesheet" href="extension/popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img src="images/icon_64x64.png" alt="" width="36" height="36">
      <div>
        <h1>EffeTune</h1>
        <p>Browser audio processing</p>
      </div>
    </header>

    <section class="sessions" aria-labelledby="sessionsTitle">
      <div class="section-heading">
        <h2 id="sessionsTitle">Processing tabs</h2>
        <span id="sessionCount" class="session-count">0 / 4</span>
      </div>
      <div id="sessionList" class="session-list"></div>
      <p id="emptySessions" class="empty-sessions">No tabs are being processed.</p>
      <button id="startButton" class="primary-button" type="button" disabled>Start on this tab</button>
      <p id="startHint" class="start-hint" hidden></p>
    </section>

    <section class="preset-row" aria-labelledby="presetLabel">
      <label id="presetLabel" for="presetSelect">Saved preset</label>
      <div class="inline-controls">
        <select id="presetSelect" disabled>
          <option value="">No saved presets</option>
        </select>
        <button id="applyPresetButton" type="button" disabled>Apply to selected tab</button>
      </div>
    </section>

    <p id="popupMessage" class="message" role="status" aria-live="polite" hidden></p>
    <button id="editPipelineButton" class="secondary-button" type="button" disabled>Edit pipeline</button>
  </main>
  <script type="module" src="extension/popup.js"></script>
</body>
</html>
