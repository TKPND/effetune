name: CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language to analyze
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ inputs.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.language == 'c-cpp' && 'manual' || 'none' }}

      - name: Build C and C++ code
        if: inputs.language == 'c-cpp'
        run: |
          cmake -S dsp -B out/dsp/codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build out/dsp/codeql --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ inputs.language }}"
